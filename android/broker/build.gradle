apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.virtualcamerapro.broker"
    compileSdk 36
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId "com.virtualcamerapro.broker"
        minSdk 36
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    buildFeatures { aidl true }
    sourceSets.main {
        manifest.srcFile "../../aosp/system-service/AndroidManifest.xml"
        java.srcDirs = ["../../aosp/system-service/src", "../../native/frame-engine/src/main/java", "../../native/camera-probe/src/main/java"]
        aidl.srcDirs = ["../../aosp/api", "../../native/ipc"]
        res.srcDirs = ["../../aosp/system-service/res"]
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
}
